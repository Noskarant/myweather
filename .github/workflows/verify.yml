name: Verify MyWeather

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Probe anonymous RSCQ catalogue on feature PR
        if: github.event_name == 'pull_request'
        run: node --input-type=module -e "import {fetchRscqObservations} from './scripts/quebec-observations.mjs'; const result=await fetchRscqObservations(); console.log('RSCQ probe status:',result.status,'stations:',result.stations.length)"
