name: Hotfix live weather

on:
  push:
    branches: [main]
    paths: [hotfix-weather.ready]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('js/weather.js'); s=p.read_text()
          marker="const NOMINATIM_REVERSE = 'https://nominatim.openstreetmap.org/reverse';\n"
          defs="""
          export const HOURLY_VARS = [
            'temperature_2m','relative_humidity_2m','dew_point_2m','apparent_temperature','precipitation_probability',
            'precipitation','rain','showers','snowfall','snow_depth','weather_code','cloud_cover','cloud_cover_low','cloud_cover_mid',
            'cloud_cover_high','visibility','wind_speed_10m','wind_direction_10m','wind_gusts_10m','surface_pressure','pressure_msl',
            'uv_index','cape','wet_bulb_temperature_2m','freezing_level_height'
          ];
          export const CURRENT_VARS = [
            'temperature_2m','relative_humidity_2m','apparent_temperature','is_day','precipitation','rain','showers','snowfall',
            'weather_code','cloud_cover','pressure_msl','surface_pressure','wind_speed_10m','wind_direction_10m','wind_gusts_10m'
          ];
          export const DAILY_VARS = [
            'weather_code','temperature_2m_max','temperature_2m_min','apparent_temperature_max','apparent_temperature_min',
            'sunrise','sunset','uv_index_max','precipitation_sum','rain_sum','showers_sum','snowfall_sum',
            'precipitation_probability_max','wind_speed_10m_max','wind_gusts_10m_max','wind_direction_10m_dominant'
          ];
          """
          if 'export const HOURLY_VARS' not in s: s=s.replace(marker,marker+'\n'+defs+'\n')
          helper="""async function fetchWithRetry(url, options = {}, attempts = 2) {
            let lastError;
            for (let attempt = 0; attempt < attempts; attempt++) {
              try {
                const response = await fetch(url, options);
                if (response.ok || (response.status < 500 && response.status !== 429)) return response;
                lastError = new Error(`HTTP ${response.status}`);
              } catch (err) { lastError = err; }
              if (attempt < attempts - 1) await sleep(450 * (attempt + 1));
            }
            throw lastError || new Error('Service réseau indisponible');
          }
          """
          sleep="function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }\n"
          if 'async function fetchWithRetry' not in s: s=s.replace(sleep,sleep+'\n'+helper+'\n')
          s=s.replace("const r = await fetch(`${FORECAST}?${params}`);\n  if (!r.ok) throw new Error(`Prévisions indisponibles (${r.status})`);","const r = await fetchWithRetry(`${FORECAST}?${params}`, {}, 2);\n  if (!r.ok) throw new Error(`Prévisions indisponibles (${r.status})`);",1)
          p.write_text(s)

          p=Path('js/app.js'); s=p.read_text()
          old="""  } catch (err) {
              console.warn(err);
              const demoLocation = location?.name ? location : state.location;
              state.location = demoLocation;
              state.forecast = createDemoForecast(demoLocation);
              state.demo = true;
              state.selectedDate = state.forecast.daily[0]?.time || null;
              saveLastLocation();
              if (!silent) showToast('Réseau météo indisponible : aperçu de démonstration affiché.', 'warn');
            } finally {
              state.loading = false;
              refs.refreshBtn.classList.remove('spinning');
              renderAll();
            }"""
          new="""  } catch (err) {
              console.warn(err);
              const requestedLocation = location?.name ? location : state.location;
              if (OFFLINE_TEST) {
                state.location = requestedLocation;
                state.forecast = createDemoForecast(requestedLocation);
                state.demo = true;
                state.selectedDate = state.forecast.daily[0]?.time || null;
                saveLastLocation();
              } else {
                state.location = requestedLocation;
                state.demo = false;
                if (!state.forecast) {
                  refs.locationName.textContent = requestedLocation.name || 'Lieu sélectionné';
                  const elevation = Number(requestedLocation.elevation);
                  refs.locationElevation.textContent = Number.isFinite(elevation) ? `${Math.round(elevation)} m` : 'alt. —';
                  refs.locationMeta.textContent = [requestedLocation.type && requestedLocation.type !== 'Localité' ? requestedLocation.type : '', requestedLocation.admin1, requestedLocation.country].filter(Boolean).join(' · ');
                  refs.currentTemp.textContent = '—°';
                  refs.currentCondition.textContent = 'Données météo momentanément indisponibles';
                  refs.feelsLike.textContent = 'Ressenti —';
                  refs.lastUpdated.textContent = 'Réessaie dans quelques instants';
                  refs.weatherGlyph.innerHTML = weatherIcon(3, 1);
                  refs.hourlyRail.innerHTML = '';
                  refs.dailyGrid.innerHTML = '';
                }
                if (!silent) showToast('Données météo indisponibles : aucune donnée fictive n’est affichée.', 'warn');
              }
            } finally {
              state.loading = false;
              refs.refreshBtn.classList.remove('spinning');
              if (state.forecast) renderAll();
            }"""
          if old not in s: raise SystemExit('fallback block not found')
          p.write_text(s.replace(old,new))

          p=Path('tests.mjs'); s=p.read_text()
          s=s.replace("import { createDemoForecast } from './js/weather.js';","import { createDemoForecast, HOURLY_VARS, CURRENT_VARS, DAILY_VARS } from './js/weather.js';")
          anchor="const lpn = estimateSnowLevel"
          checks="""assert.ok(HOURLY_VARS.length >= 20);
          assert.ok(CURRENT_VARS.includes('temperature_2m'));
          assert.ok(DAILY_VARS.includes('temperature_2m_max'));
          assert.ok(HOURLY_VARS.includes('freezing_level_height'));

          """
          if 'CURRENT_VARS.includes' not in s: s=s.replace(anchor,checks+anchor)
          p.write_text(s)

          p=Path('sw.js'); p.write_text(p.read_text().replace("myweather-v1.2.0","myweather-v1.2.1"))
          p=Path('package.json'); p.write_text(p.read_text().replace('"version": "1.2.0"','"version": "1.2.1"'))
          PY
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Commit
        shell: bash
        run: |
          rm -f hotfix-weather.ready .github/workflows/hotfix-weather.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix live weather fallback"
          git push
