name: MyWeather checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          npm run check
          node --check sw.js
      - name: Probe production forecast API (diagnostic)
        run: node scripts/diagnose-live-weather.mjs
      - name: Run application and network-failure regression tests
        run: npm test
      - name: Install browser for iPhone WebKit smoke
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps webkit
      - name: Check live MyWeather in Safari WebKit
        run: node scripts/browser-smoke.mjs
