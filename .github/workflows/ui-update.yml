name: Apply MyWeather UI update

on:
  push:
    branches: [main]
    paths:
      - update/update.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated UI snapshot
        shell: bash
        run: |
          cat update/payload.* | base64 -d > /tmp/myweather-update.tar.gz
          tar -xzf /tmp/myweather-update.tar.gz -C .
      - name: Test
        run: |
          npm test
          npm run check
      - name: Commit UI refinement
        shell: bash
        run: |
          rm -rf update .github/workflows/ui-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine landing weather UI"
          git push
