name: MyWeather Windows widget
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'widget.html'
      - 'js/widget.js'
      - 'js/widget.css'
      - 'desktop-widget/**'
      - '.github/workflows/windows-widget.yml'
  push:
    branches: [main]
    paths:
      - 'widget.html'
      - 'js/widget.js'
      - 'js/widget.css'
      - 'desktop-widget/**'

permissions:
  contents: read

jobs:
  package-widget:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate widget JavaScript
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check ../js/widget.js
          node --check ../js/widget-model.js
          node --check ../js/weather.js
      - name: Test widget presentation model
        run: node --test tests/widget-model.test.mjs
      - name: Validate native geolocation PowerShell syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './get-location.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Install packaging dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MyWeather-Widget-Windows-x64
          path: desktop-widget/dist/*.exe
          if-no-files-found: error
          retention-days: 14
