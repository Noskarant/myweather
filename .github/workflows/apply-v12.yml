name: Apply MyWeather v1.2

on:
  push:
    branches: [main]
    paths:
      - update-v12/update.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.2 snapshot
        shell: bash
        run: |
          cat update-v12/payload.* | base64 -d > /tmp/myweather-v12.tar.gz
          tar -xzf /tmp/myweather-v12.tar.gz -C .
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Commit v1.2
        shell: bash
        run: |
          rm -rf update-v12 .github/workflows/apply-v12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve mobile scale, desktop science dashboard and topographic search"
          git push
