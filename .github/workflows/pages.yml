name: Deploy MyWeather to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Scheduled runs are best-effort: staggered quarter-hour slots improve the
  # likelihood of receiving at least one fresh snapshot within the 100min TTL.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Rhône and Savoie station observations
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          METEOFRANCE_PACKAGE_API_KEY: ${{ secrets.METEOFRANCE_PACKAGE_API_KEY }}
        run: node scripts/update-rhone-observations.mjs
        timeout-minutes: 3
      - name: Resolve verified household addresses from BAN
        run: node scripts/resolve-custom-places.mjs
        timeout-minutes: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
